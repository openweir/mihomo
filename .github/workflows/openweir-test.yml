# Tests for OpenWeir's Alpha branch (upstream Alpha plus OpenWeir's changes). Upstream's test.yml
# stays untouched and runs as well.
name: OpenWeir Test
on:
  push:
    branches: [Alpha]
    paths-ignore: ["docs/**", "README.md"]
  pull_request:
    branches: [Alpha]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
      SKIP_CONCURRENT_TEST: 1
      SKIP_INTEROP_TEST: 1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'
      - run: go test ./...
      - run: go test ./... -tags with_gvisor -count=1
