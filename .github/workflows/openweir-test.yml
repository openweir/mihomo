# Tests for OpenWeir's Alpha branch (upstream Alpha plus OpenWeir's changes). Upstream's test.yml
# stays untouched and runs as well.
name: OpenWeir Test
on:
  push:
    branches: [Alpha]
    paths-ignore: ["docs/**", "README.md"]
  pull_request:
    branches: [Alpha]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    # Two to five minutes. This leaves room for go test's own 10-minute limit per package to
    # fire first and print the hung goroutines.
    timeout-minutes: 20
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
      SKIP_CONCURRENT_TEST: 1
      SKIP_INTEROP_TEST: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'
      - run: go test ./...
      - run: go test ./... -tags with_gvisor -count=1
